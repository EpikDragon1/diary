async function changePassword() {
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  const newPass2 = document.getElementById('newPass2').value;
  
  const oldHash = await hashPassword(currentUser.salt + oldPass);
  if (oldHash !== currentUser.hash) return toast('Неверный текущий пароль', 'error');
  if (newPass.length < 6) return toast('Минимум 6 символов', 'error');
  if (newPass !== newPass2) return toast('Пароли не совпадают', 'error');
  
  currentUser.salt = generateSalt();
  currentUser.hash = await hashPassword(currentUser.salt + newPass);
  saveUser();
  closeModal();
  toast('✅ Пароль изменён');
}

function exportData() {
  const data = { ...currentUser };
  delete data.salt; delete data.hash;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `diary_${currentUser.username}_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('📥 Данные экспортированы');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('Импортировать данные? Текущие будут заменены.')) return;
      if (data.grades) currentUser.grades = data.grades;
      if (data.tasks) currentUser.tasks = data.tasks;
      if (data.schedule) currentUser.schedule = data.schedule;
      saveUser();
      renderPage(currentPage);
      toast('✅ Данные импортированы');
    } catch (err) {
      toast('❌ Ошибка: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function deleteAccount() {
  if (!confirm('Удалить аккаунт? Все данные будут потеряны!')) return;
  if (!confirm('ТОЧНО удалить "' + currentUser.username + '"?')) return;
  const users = DB.getUsers();
  delete users[currentUser.username];
  DB.saveUsers(users);
  logout();
  toast('🗑️ Аккаунт удалён');
}

function saveTeacherGrade() {
  const studentUsername = document.getElementById('gradeStudent').value;
  const subject = document.getElementById('gradeSubject').value;
  const value = parseInt(document.getElementById('gradeValue').value);
  const type = document.getElementById('gradeType').value;
  const date = document.getElementById('gradeDate').value;
  
  if (!subject) return toast('Выберите предмет', 'error');
  
  // Проверяем, что ученик из текущего класса
  if (!currentClass) return toast('Выберите класс', 'error');
  
  const users = DB.getUsers();
  const student = users[studentUsername];
  if (!student || student.class !== currentClass) {
    return toast('Нет доступа к этому ученику', 'error');
  }
  
  if (value < 1 || value > 5) return toast('Оценка должна быть от 1 до 5', 'error');
  
  // Проверка: обычный учитель может ставить только по своим предметам
  const isHomeroom = currentUser.isHomeroomTeacher;
  if (!isHomeroom && !currentUser.subjects.includes(subject)) {
    return toast('Это не ваш предмет. Вы можете ставить оценки только по: ' + currentUser.subjects.join(', '), 'error');
  }
  
  // Проверка: дата не в будущем
  const today = new Date(); today.setHours(0,0,0,0);
  const gradeDate = new Date(date); gradeDate.setHours(0,0,0,0);
  if (gradeDate > today) return toast('Нельзя ставить оценку на будущую дату', 'error');
  
  if (!student.grades) student.grades = {};
  if (!student.grades[subject]) student.grades[subject] = [];
  
  student.grades[subject].push({
    value, type, date,
    teacher: currentUser.fullname,
    teacherUsername: currentUser.username
  });
  
  DB.saveUsers(users);
  closeModal();
  renderPage(currentPage);
  toast('✅ Оценка поставлена');
}

function saveTeacherTask() {
  const forWho = document.getElementById('taskStudent').value;
  const subject = document.getElementById('taskSubject').value;
  const text = document.getElementById('taskText').value.trim();
  const dueDate = document.getElementById('taskDate').value;
  
  if (!text) return toast('Введите задание', 'error');
  if (!subject) return toast('Выберите предмет', 'error');
  if (!dueDate) return toast('Укажите срок', 'error');
  
  // Проверяем currentClass
  if (!currentClass) return toast('❌ Не выбран класс', 'error');
  
  // Проверка: обычный учитель может добавлять задания только по своим предметам
  const isHomeroom = currentUser.isHomeroomTeacher;
  if (!isHomeroom && !currentUser.subjects.includes(subject)) {
    return toast('Это не ваш предмет. Вы можете добавлять задания только по: ' + currentUser.subjects.join(', '), 'error');
  }
  
  // Проверка: срок не в прошлом
  const today = new Date(); today.setHours(0,0,0,0);
  const taskDue = new Date(dueDate); taskDue.setHours(0,0,0,0);
  if (taskDue < today) return toast('Срок выполнения не может быть в прошлом', 'error');
  
  const users = DB.getUsers();
  
  // Получаем учеников текущего класса
  let targets = Object.values(users)
    .filter(u => u.role === 'student' && u.class === currentClass)
    .map(u => u.username);
  
  // Если выбран конкретный ученик
  if (forWho !== 'all') {
    targets = [forWho];
  }
  
  if (targets.length === 0) {
    return toast('❌ В классе ' + currentClass + ' нет учеников', 'error');
  }
  
  let addedCount = 0;
  targets.forEach(username => {
    const student = users[username];
    if (!student) return;
    if (!student.tasks) student.tasks = [];
    student.tasks.push({
      subject, text, dueDate, done: false,
      teacher: currentUser.fullname,
      teacherUsername: currentUser.username,
      created: Date.now()
    });
    addedCount++;
  });
  
  DB.saveUsers(users);
  closeModal();
  renderPage(currentPage);
  toast(`✅ Задание добавлено ${addedCount} ученикам класса ${currentClass}`);
}

  const users = DB.getUsers();
  const task = allTasks[taskIdx];
  
  const student = users[task.studentUsername];
  if (student && student.tasks) {
    student.tasks = student.tasks.filter(t => !(t.text === task.text && t.dueDate === task.dueDate && t.subject === task.subject && t.teacherUsername === currentUser.username));

  DB.saveUsers(users);

}

// ============ ОБЩЕЕ ============
function saveUser() {
  const users = DB.getUsers();
  const u = users[currentUser.username];
  if (!u) return;
  
  const keep = ['fullname', 'salt', 'hash', 'role', 'created', 'settings'];
  if (currentUser.role === 'student') {
    u.class = currentUser.class;
    u.grades = currentUser.grades;
    u.tasks = currentUser.tasks;
    u.schedule = currentUser.schedule;
    u.parents = currentUser.parents;
    u.homeroomTeacher = currentUser.homeroomTeacher;
    // Сохраняем tempPassword из settings
    if (currentUser.settings && currentUser.settings.tempPassword) {
      if (!u.settings) u.settings = {};
      u.settings.tempPassword = currentUser.settings.tempPassword;
    }
  } else if (currentUser.role === 'teacher') {
    u.subjects = currentUser.subjects;
    u.customSubjects = currentUser.customSubjects || [];
    u.students = currentUser.students;
    u.homeroomClass = currentUser.homeroomClass || null;
    u.isHomeroomTeacher = currentUser.isHomeroomTeacher || false;
  } else if (currentUser.role === 'parent') {
    u.children = currentUser.children;
  } else if (currentUser.role === 'admin') {
    u.school = currentUser.school;
  }
  keep.forEach(k => u[k] = currentUser[k]);
  DB.saveUsers(users);
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

function getTaskBadge(dueDate) {
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueDate); due.setHours(0,0,0,0);
  const diff = Math.ceil((due - today) / (1000*60*60*24));
  if (diff < 0) return { class: 'badge-urgent', text: 'Просрочено' };
  if (diff === 0) return { class: 'badge-urgent', text: 'Сегодня' };
  if (diff <= 2) return { class: 'badge-soon', text: 'Скоро' };
  return { class: 'badge-ok', text: `Через ${diff} дн.` };
}

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function askResetPassword() {
  const pass = prompt('⚠️ ВНИМАНИЕ! Это действие удалит ВСЕ данные системы.\n\nВведите пароль администратора для подтверждения:');
  if (!pass) return;
  
  // Ищем админа в localStorage
  const users = DB.getUsers();
  const admin = Object.values(users).find(u => u.role === 'admin');
  
  if (!admin) {
    return alert('Администратор не найден');
  }
  
  const hash = await hashPassword(admin.salt + pass);
  if (hash !== admin.hash) {
    return alert('❌ Неверный пароль администратора');
  }
  
  if (!confirm('Вы уверены? Все пользователи, оценки, задания будут УДАЛЕНЫ безвозвратно!')) return;
  if (!confirm('ПОСЛЕДНИЙ РАЗ: продолжить удаление?')) return;
  
  localStorage.clear();
  toast('✅ Данные удалены. Перезагрузите страницу.');
  setTimeout(() => location.reload(), 1000);
}

function initAuthScreen() {
  const users = DB.getUsers();
  const hasAdmin = Object.values(users).some(u => u.role === 'admin');
  
  if (!hasAdmin) {
    showFirstRun();
  } else {
    showLogin();
  }
}

// Запуск при загрузке страницы
(function() {
  document.getElementById('authScreen').style.display = 'flex';
  initAuthScreen();
  
  const saved = DB.getCurrent();
  if (saved) {
    const users = DB.getUsers();
    if (users[saved]) {
      currentUser = { username: saved, ...users[saved] };
      startSession();
    }
  }
  
  const loginPassEl = document.getElementById('loginPassword');
  if (loginPassEl) {
    loginPassEl.addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });
  }
})();
</script>
